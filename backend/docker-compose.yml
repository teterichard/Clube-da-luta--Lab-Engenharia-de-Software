services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: topaai
      MYSQL_USER: topaai
      MYSQL_PASSWORD: topaai
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/permissoes-teste.sql:/docker-entrypoint-initdb.d/02-permissoes-teste.sql:ro
